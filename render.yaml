services:
  - type: web
    name: back-bidnow
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --capture-output --access-logfile - --error-logfile -
    autoDeploy: true
